services:
  web:
    build: .
    container_name: gliccops-web
    network_mode: host
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gliccops-api
    network_mode: host
    restart: unless-stopped
    env_file:
      - /etc/glicc-frontend.env
    environment:
      FRONTEND_DB: /app/data/gliccops.db
      FRONTEND_TOKEN_FILE: /app/data/ingest.token
      GATEWAY_KEYS_FILE: /app/gateway/keys.json
    volumes:
      - ./data:/app/data
      - ../gateway:/app/gateway
    read_only: true
    tmpfs:
      - /tmp:size=16m
    gpus: all
