 {k:'die',l:'GA104 Die',x:380,y:150},{k:'mem',l:'GDDR6 · 8 chips',x:310,y:113},

function useTelemetry(){
 const base={temp:63,power:168,clock:1860,util:92,vram:5.9,fan:1850,pcie:0};
 const [t,setT]=useState(base);
 useEffect(()=>{let alive=true;
  const poll=async()=>{
   try{
    const r=await fetch('/api/telemetry/latest',{cache:'no-store'});
    if(!r.ok) throw new Error('offline');
    const data=await r.json();
    const g=(data.gpus||[])[0];
    if(!g||!alive) return;
    setT({
     temp:g.temp_c??base.temp,
     power:g.power_w??base.power,
     clock:g.clock_mhz??base.clock,
     util:g.util_pct??base.util,
     vram:(g.vram_used_mib??5940)/1024,
     fan:g.fan_rpm??base.fan,
     pcie:g.pcie_gbs??0
    });
   }catch(e){/* keep last known sample */}
  };
  poll();const id=setInterval(poll,1200);
  return()=>{alive=false;clearInterval(id)}},[]);
 return t;
}

  </g>
  <circle r="15" fill="#0b0d12" stroke="#10b981" strokeWidth="1.5"/><circle r="4" fill="#10b981"/>
 </g>);
}

const SM_DIS=new Set([6,7,14,15,22,23,30,31,39,47]);
function SMOverlay({t,onClose}){
 const tiles=[];
 for(let g=0;g<6;g++){const gx=56+(g%3)*180,gy=g<3?24:178;

 const avg=tiles.filter(x=>!x.dis).reduce((a,x)=>a+x.u,0)/38;
 const tx={fontFamily:'JetBrains Mono',fontSize:9,fontWeight:700,fill:'#64748b'};

  <div className="flex items-center justify-between text-white mb-1">

  </div>
  <svg viewBox="0 0 640 340" className="flex-1 min-h-0 w-full">
   {[0,1,2,3].map(k=><g key={k}>{[12,596].map(x=><g key={x}><rect x={x} y={24+k*68} width="32" height="60" rx="4" fill="#161b24" stroke="#2f3644"/><text x={x+16} y={58+k*68} textAnchor="middle" style={tx}>MC</text></g>)}</g>)}
   {Array.from({length:6}).map((_,g)=>{const gx=56+(g%3)*180,gy=g<3?24:178;return <g key={g}><rect x={gx} y={gy} width="168" height="118" rx="8" fill="#12161e" stroke="#2f3644"/><text x={gx+10} y={gy+15} style={tx}>GPC {g}</text><text x={gx+10} y={gy+111} style={{...tx,fontSize:8}}>RASTER · 16 ROPs</text></g>})}
   <rect x="56" y="148" width="528" height="24" rx="6" fill="#161b24" stroke="#10b981" strokeOpacity=".4"/><text x="320" y="164" textAnchor="middle" style={tx}>L2 CACHE · 4 MB</text>
   <rect x="56" y="304" width="528" height="28" rx="6" fill="#161b24" stroke="#2f3644"/><text x="320" y="322" textAnchor="middle" style={tx}>GIGATHREAD ENGINE · PCIe 4.0 x16 · NVENC / NVDEC</text>
   {tiles.map(s=><rect key={s.i} x={s.x} y={s.y} width="35" height="36" rx="4" fill={s.dis?'#12161e':`hsl(${150-s.u*150} 80% ${28+s.u*22}%)`} stroke={s.dis?'#2f3644':'none'} strokeDasharray={s.dis?'3 3':undefined} style={{transition:'fill 1s'}}><title>{s.dis?`SM ${s.i} · fused off`:`SM ${s.i} · ${(s.u*100).toFixed(0)}%`}</title></rect>)}
  </svg>
 </div>);
}

const PINS3=[{k:'die',l:'GA104 Die'},{k:'mem',l:'GDDR6 · 8 chips'},{k:'vrm',l:'VRM Phases'},{k:'fanA',l:'Fan A'},{k:'fanB',l:'Fan B'},{k:'pcie',l:'PCIe 4.0 x16'}];
function GpuHero(){
 const t=useTelemetry();const tRef=useRef(t);tRef.current=t;
 const mount=useRef(null),pinRefs=useRef({}),api=useRef({});

 useEffect(()=>{
  const el=mount.current;let renderer;
  try{renderer=new THREE.WebGLRenderer({antialias:true,alpha:true})}catch(e){setOk(false);return}

  const cv=renderer.domElement;cv.style.display='block';el.appendChild(cv);

  const grid=new THREE.GridHelper(900,36,0x10b981,0x1f2a2a);grid.position.y=-55;grid.material.transparent=true;grid.material.opacity=.22;scene.add(grid);
  const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,metalness:.55,roughness:.42,transparent:true},o||{}));

  const shM=M(0x20252f,{metalness:.7,roughness:.4}),ledM=M(0x10b981,{emissive:0x10b981,emissiveIntensity:1.2}),fanM=M(0x2a3140),hubM=M(0x0b0d12);
  const sh=new THREE.Shape(),W=140,H=55,r=12;
  sh.moveTo(-W+r,-H);sh.lineTo(W-r,-H);sh.quadraticCurveTo(W,-H,W,-H+r);sh.lineTo(W,H-r);sh.quadraticCurveTo(W,H,W-r,H);sh.lineTo(-W+r,H);sh.quadraticCurveTo(-W,H,-W,H-r);sh.lineTo(-W,-H+r);sh.quadraticCurveTo(-W,-H,-W+r,-H);
  [-70,70].forEach(x=>{const h=new THREE.Path();h.absarc(x,0,43,0,Math.PI*2,true);sh.holes.push(h)});
  const shG=new THREE.ExtrudeGeometry(sh,{depth:4,bevelEnabled:false});shG.rotateX(-Math.PI/2);
  const shMesh=new THREE.Mesh(shG,shM);shMesh.position.y=29;gShroud.add(shMesh);
  gShroud.add(box(120,1,1.6,ledM,0,33.4,52));
  const fans=[];[-70,70].forEach(x=>{const f=new THREE.Group();
   for(let i=0;i<9;i++){const b=new THREE.Group();b.rotation.y=i*Math.PI*2/9;const bl=box(9,1,29,fanM,0,0,24);bl.rotation.z=.45;b.add(bl);f.add(b)}
   f.add(new THREE.Mesh(new THREE.CylinderGeometry(9,9,3,24),hubM));f.position.set(x,0,0);gFans.add(f);fans.push(f);
   const ring=new THREE.Mesh(new THREE.TorusGeometry(42,1.1,8,48),ledM);ring.rotation.x=Math.PI/2;ring.position.set(x,0,0);gFans.add(ring)});
  const shellMs=[shM,ledM,fanM,hubM],sinkMs=[sinkM];
  const pinObj={die:dieMesh,mem:memMeshes[1],vrm:vrmMeshes[2],fanA:fans[0],fanB:fans[1],pcie};
  const resize=()=>{const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h);cam.aspect=w/h;cam.updateProjectionMatrix()};
  resize();const ro=new ResizeObserver(resize);ro.observe(el);
  api.current.zoom=f=>{cam.position.sub(ctl.target).multiplyScalar(f).add(ctl.target)};
  let dn=null;cv.addEventListener('pointerdown',e=>{dn=[e.clientX,e.clientY]});
  cv.addEventListener('pointerup',e=>{if(!dn||Math.hypot(e.clientX-dn[0],e.clientY-dn[1])>5)return;const b=cv.getBoundingClientRect(),rc=new THREE.Raycaster();rc.setFromCamera(new THREE.Vector2((e.clientX-b.left)/b.width*2-1,-(e.clientY-b.top)/b.height*2+1),cam);if(rc.intersectObject(dieMesh).length)setSm(true)});
  const hc=(tv,m)=>{m.color.setHSL(clamp(140-(tv-45)*3.2,0,140)/360,.85,.5);m.emissive.copy(m.color);m.emissiveIntensity=.4};
  const v=new THREE.Vector3();let raf,last=performance.now(),e=0;

   ctl.update();card.updateMatrixWorld(true);
   const w=el.clientWidth,h=el.clientHeight;
   Object.keys(pinObj).forEach(k=>{const p=pinRefs.current[k];if(!p)return;v.setFromMatrixPosition(pinObj[k].matrixWorld);v.project(cam);
    p.style.display=v.z>1?'none':'block';p.style.transform=`translate(${(v.x*.5+.5)*w}px,${(-v.y*.5+.5)*h}px)`});

 },[]);
 if(!ok)return <GpuHero2D/>;
 const val={die:`${t.temp.toFixed(0)}°C · ${t.clock.toFixed(0)} MHz`,mem:`${(t.temp-9).toFixed(0)}°C · ${t.vram.toFixed(1)}/8 GB`,vrm:`${(t.temp-3).toFixed(0)}°C · ${(t.power/12).toFixed(0)} A`,fanA:`${t.fan.toFixed(0)} RPM`,fanB:`${t.fan.toFixed(0)} RPM`,pcie:`${t.pcie.toFixed(1)} GB/s`};
 const rows=[['Core temp',`${t.temp.toFixed(0)}°C`,(t.temp-30)/60],['Board power',`${t.power.toFixed(0)} W`,t.power/200],['Core clock',`${t.clock.toFixed(0)} MHz`,t.clock/1965],['VRAM',`${t.vram.toFixed(1)} / 8 GB`,t.vram/8],['Utilization',`${t.util.toFixed(0)}%`,t.util/100]];
 return(
