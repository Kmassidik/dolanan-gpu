<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 500" width="920" height="500" role="img" aria-labelledby="title desc">
  <title id="title">Measured llama.cpp decode throughput on three RTX 3060 Ti cards</title>
  <desc id="desc">Grouped bar chart comparing chat and document decode tokens per second for baseline, 64K general, 64K document, and 250K selective KV tier configurations.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2937; }
    .muted { fill: #6b7280; }
    .grid { stroke: #e5e7eb; stroke-width: 1; }
    .axis { stroke: #9ca3af; stroke-width: 1.2; }
    .chat { fill: #3b82f6; }
    .doc { fill: #10b981; }
    .bg { fill: #ffffff; }
    .value { font-size: 12px; font-weight: 700; }
    .label { font-size: 12px; font-weight: 600; }
    .small { font-size: 11px; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e5e7eb; }
      .muted { fill: #9ca3af; }
      .grid { stroke: #374151; }
      .axis { stroke: #6b7280; }
      .chat { fill: #60a5fa; }
      .doc { fill: #34d399; }
      .bg { fill: #0b1220; }
    }
  </style>

  <rect class="bg" x="0" y="0" width="920" height="500" rx="8"/>
  <text x="36" y="32" font-size="20" font-weight="700">Measured decode throughput</text>
  <text x="36" y="54" class="muted small">Heretic Qwen36-35B Q3_K_M · 3× RTX 3060 Ti · one request · median tok/s</text>

  <g class="grid">
    <line x1="72" y1="370" x2="884" y2="370"/>
    <line x1="72" y1="295" x2="884" y2="295"/>
    <line x1="72" y1="220" x2="884" y2="220"/>
    <line x1="72" y1="145" x2="884" y2="145"/>
    <line x1="72" y1="70" x2="884" y2="70"/>
  </g>
  <g class="muted small" text-anchor="end">
    <text x="60" y="374">0</text>
    <text x="60" y="299">40</text>
    <text x="60" y="224">80</text>
    <text x="60" y="149">120</text>
    <text x="60" y="74">160</text>
  </g>
  <line x1="72" y1="70" x2="72" y2="370" class="axis"/>

  <!-- Baseline -->
  <rect x="112" y="218.7" width="52" height="151.3" rx="4" class="chat"/>
  <rect x="172" y="217.8" width="52" height="152.2" rx="4" class="doc"/>
  <text x="138" y="208" text-anchor="middle" class="value">80.7</text>
  <text x="198" y="207" text-anchor="middle" class="value">81.2</text>

  <!-- 64K general -->
  <rect x="314" y="171.6" width="52" height="198.4" rx="4" class="chat"/>
  <rect x="374" y="151.8" width="52" height="218.2" rx="4" class="doc"/>
  <text x="340" y="161" text-anchor="middle" class="value">105.8</text>
  <text x="400" y="141" text-anchor="middle" class="value">116.4</text>

  <!-- 64K document -->
  <rect x="516" y="218.9" width="52" height="151.1" rx="4" class="chat"/>
  <rect x="576" y="95.9" width="52" height="274.1" rx="4" class="doc"/>
  <text x="542" y="208" text-anchor="middle" class="value">80.6</text>
  <text x="602" y="85" text-anchor="middle" class="value">146.2</text>

  <!-- 250K selective KV -->
  <rect x="718" y="181.9" width="52" height="188.1" rx="4" class="chat"/>
  <rect x="778" y="161.1" width="52" height="208.9" rx="4" class="doc"/>
  <text x="744" y="171" text-anchor="middle" class="value">100.3</text>
  <text x="804" y="151" text-anchor="middle" class="value">111.4</text>

  <g class="label" text-anchor="middle">
    <text x="168" y="394">Original</text>
    <text x="168" y="410" class="muted small">64K baseline</text>

    <text x="370" y="394">General</text>
    <text x="370" y="410" class="muted small">64K · MTP3</text>

    <text x="572" y="394">Document</text>
    <text x="572" y="410" class="muted small">64K · MTP8</text>

    <text x="774" y="394">Long</text>
    <text x="774" y="410" class="muted small">250K · KV tier</text>
  </g>

  <g transform="translate(72,448)">
    <rect x="0" y="-11" width="14" height="14" rx="3" class="chat"/>
    <text x="22" y="0" class="small">Chat decode</text>
    <rect x="138" y="-11" width="14" height="14" rx="3" class="doc"/>
    <text x="160" y="0" class="small">Document decode</text>
    <text x="680" y="0" class="muted small" text-anchor="end">commit c545df8</text>
  </g>
</svg>
